name: CDC Testing Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consumer-tests:
    name: Consumer Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create pacts directory
        run: mkdir -p pacts

      - name: Run Consumer contract tests
        run: pytest consumer/tests/test_order_contract.py -v --tb=short

      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pacts/

  provider-tests:
    name: Provider Verification Tests
    runs-on: ubuntu-latest
    needs: consumer-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create pacts directory
        run: mkdir -p pacts

      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-files
          path: pacts/

      - name: Run Provider verification tests
        run: pytest provider/tests/test_provider_verify.py -v --tb=short